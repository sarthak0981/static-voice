# ====================================================================
# STATIC Voice — Production Coturn TURN/STUN Configuration
# ====================================================================

# Network & Listening Ports
listening-port=3478
tls-listening-port=443
alt-listening-port=0
alt-tls-listening-port=0

# Listening IP addresses (0.0.0.0 binds to all interfaces)
listening-ip=0.0.0.0

# External Public IP of your server (REQUIRED if behind NAT / AWS / GCP / DigitalOcean)
# Replace with your server's actual public IPv4 address:
# external-ip=YOUR_SERVER_PUBLIC_IP

# Realm & Server Identity
realm=turn.example.com
server-name=static-turn

# Ephemeral Time-Limited HMAC Credentials (STATIC coturn integration)
use-auth-secret
static-auth-secret=CHANGE_THIS_SECRET_IN_PRODUCTION

# Fingerprint in all STUN/TURN packets
fingerprint

# Security Hardening & Private Network Access Prevention
no-multicast-peers
no-cli

# Deny routing to internal/private VPC address spaces (prevents SSRF via TURN relay)
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=::1
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Resource Quotas & Anti-Abuse Rate Limits
total-quota=2000
user-quota=100
max-allocate-per-user=10
bps-capacity=0
stale-nonce=600

# Relay Port Range (UDP allocation range for voice media)
min-port=49152
max-port=65535

# TLS Certificates (Required for TURNS over port 443 through corporate firewalls)
cert=/etc/ssl/turn/fullchain.pem
pkey=/etc/ssl/turn/privkey.pem
cipher-list="ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"

# Logging
verbose
log-file=/var/log/coturn/turn.log
simple-log
